name: Apply ChatGPT Psalms 91-120 completion batch

on:
  push:
    branches: [main]
    paths:
      - scripts/chatgpt-complete-psalms-091-120.mjs
      - .github/workflows/chatgpt-psalms-091-120.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - name: Generate deterministic ChatGPT-authored Psalms 91-120
        run: node scripts/chatgpt-complete-psalms-091-120.mjs
      - name: Validate restored and mystical alignment
        run: node scripts/validate-generated-canon.mjs --books="psalms"
      - name: Rebuild library index
        run: node scripts/build-library-index.mjs
      - name: Commit batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripture/psalms metadata/psalms-progress.json metadata/library-index.json
          if git diff --cached --quiet; then
            echo "Psalms 91-120 completion already applied."
            exit 0
          fi
          git commit -m "Complete Psalms 91-120 via ChatGPT batch"
          git pull --rebase origin main
          git push
