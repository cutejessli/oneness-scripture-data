name: Polish ChatGPT Psalms 91-120

on:
  push:
    branches: [main]
    paths:
      - scripts/polish-chatgpt-psalms-091-120.mjs
      - .github/workflows/polish-chatgpt-psalms-091-120.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: node scripts/polish-chatgpt-psalms-091-120.mjs
      - run: node scripts/validate-generated-canon.mjs --books="psalms"
      - run: node scripts/build-library-index.mjs
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripture/psalms metadata/library-index.json
          if git diff --cached --quiet; then
            echo "Psalms 91-120 polish already applied."
            exit 0
          fi
          git commit -m "Polish Psalms 91-120 wording"
          git pull --rebase origin main
          git push
