name: Apply ChatGPT Nehemiah completion batch

on:
  push:
    branches: [main]
    paths:
      - "scripts/chatgpt-complete-nehemiah.mjs"
      - ".github/workflows/chatgpt-nehemiah-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-nehemiah-completion
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - name: Generate deterministic ChatGPT-authored chapter files
        run: node scripts/chatgpt-complete-nehemiah.mjs
      - name: Validate restored and mystical alignment
        run: node scripts/validate-generated-canon.mjs --books="nehemiah"
      - name: Rebuild library index
        run: node scripts/build-library-index.mjs
      - name: Commit batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripture/nehemiah metadata/nehemiah-progress.json metadata/library-index.json
          if git diff --cached --quiet; then
            echo "Nehemiah completion already applied."
            exit 0
          fi
          git commit -m "Complete Nehemiah 6-13 via ChatGPT batch"
          git push
