name: Backfill rich scripture layers

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill-rich-layers.mjs"
      - "scripts/backfill-large-batch.mjs"
      - "scripts/backfill-batch-2.mjs"
      - "scripts/backfill-batch-3.mjs"
      - ".github/workflows/backfill-rich-layers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Backfill 103 Torah chapters
        run: node scripts/backfill-batch-3.mjs
      - name: Commit large backfill batch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripture/exodus scripture/leviticus scripture/numbers
          git commit -m "Backfill rich layers across 103 Torah chapters"
          git push
