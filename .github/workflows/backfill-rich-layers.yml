name: Backfill rich scripture layers

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill-rich-layers.mjs"
      - "scripts/backfill-large-batch.mjs"
      - ".github/workflows/backfill-rich-layers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Backfill 100 chapters across four books
        run: node scripts/backfill-large-batch.mjs --books=2-samuel,1-kings,2-kings,1-chronicles
      - name: Commit large backfill batch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripture/2-samuel scripture/1-kings scripture/2-kings scripture/1-chronicles
          git commit -m "Backfill rich layers across 100 historical chapters"
          git push
