name: Backfill modern and original scripture reference layers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-reference-layers.yml"
      - "scripts/backfill-reference-layers.mjs"
  workflow_dispatch:
  workflow_run:
    workflows: ["Finish remaining Oneness Scripture canon"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: oneness-reference-layer-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Download current public-domain Berean Standard Bible USFM
        run: |
          mkdir -p /tmp/modern-usfm
          curl -L --fail --retry 3 https://bereanbible.com/bsb_usfm.zip -o /tmp/bsb_usfm.zip
          unzip -q /tmp/bsb_usfm.zip -d /tmp/modern-usfm

      - name: Prepare Open Scriptures Hebrew Bible in English versification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libalgorithm-diff-perl libjson-perl libxml-libxml-perl libclone-perl libhash-merge-perl
          git clone --depth 1 https://github.com/openscriptures/morphhb.git /tmp/morphhb
          cd /tmp/morphhb
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('morphhbXML-to-JSON.pl')
          lines = p.read_text().splitlines()
          out = []
          for line in lines:
              if "my $stripPointing = 'true';" in line:
                  line = line.replace("my $stripPointing = 'true';", "my $stripPointing = 0;")
              stripped = line.lstrip()
              if stripped.startswith('splice') and '$remapped' in stripped:
                  indent = line[:len(line)-len(stripped)]
                  m = re.match(r'splice\s*\(\s*(\$remapped\{.*?\}\s*\[.*?\]\s*\[.*?\])\s*,\s*(.*)$', stripped)
                  if m:
                      line = f"{indent}splice( @{{ {m.group(1)} }}, {m.group(2)}"
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          PY
          perl -c morphhbXML-to-JSON.pl
          perl morphhbXML-to-JSON.pl
          test -s index.js
          node - <<'NODE'
          const fs = require('fs');
          const data = require('/tmp/morphhb/index.js');
          const names = {
            'I Samuel':'1 Samuel', 'II Samuel':'2 Samuel',
            'I Kings':'1 Kings', 'II Kings':'2 Kings',
            'I Chronicles':'1 Chronicles', 'II Chronicles':'2 Chronicles'
          };
          const normalized = {};
          for (const [name, chapters] of Object.entries(data)) normalized[names[name] || name] = chapters;
          fs.writeFileSync('/tmp/morphhb/hebrew.json', JSON.stringify(normalized));
          NODE
          test -s hebrew.json

      - name: Prepare SBL Greek New Testament token data
        run: git clone --depth 1 https://github.com/morphgnt/sblgnt.git /tmp/sblgnt

      - name: Backfill BSB and original-language layers
        env:
          WEB_USFM_DIR: /tmp/modern-usfm
          OSHB_JSON: /tmp/morphhb/hebrew.json
          MORPHGNT_DIR: /tmp/sblgnt
        run: |
          node scripts/backfill-reference-layers.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const d of fs.readdirSync('scripture', {withFileTypes:true}).filter(d=>d.isDirectory())) {
            const id = d.name;
            const dir = path.join('scripture', id);
            for (const name of fs.readdirSync(dir).filter(n => new RegExp(`^${id}-\\d{3}\\.json$`).test(n))) {
              const p = path.join(dir,name);
              const doc = JSON.parse(fs.readFileSync(p,'utf8'));
              for (const v of doc.verses || []) {
                if (v.modern?.text) {
                  v.modern.source = 'BSB';
                  v.modern.edition = 'Berean Standard Bible, current 3rd Printing';
                }
              }
              doc.reference_layers ||= {};
              doc.reference_layers.modern = {
                source: 'Berean Standard Bible',
                edition: 'Current, updated to 3rd Printing',
                license: 'Public Domain',
                provenance: 'Official Berean Bible USFM download'
              };
              if (doc.verses?.every(v => v.modern?.text)) doc.layer_status.modern_comparison = 'complete-BSB';
              fs.writeFileSync(p, JSON.stringify(doc,null,2)+'\n');
            }
          }
          const reportPath = 'metadata/reference-layer-report.json';
          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath,'utf8'));
            report.sources.modern = 'Berean Standard Bible, current 3rd Printing (Public Domain)';
            fs.writeFileSync(reportPath, JSON.stringify(report,null,2)+'\n');
          }
          NODE

      - name: Validate and identify any reference gaps
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          let chapters=0, verses=0;
          const missingModern=[];
          const missingOriginal=[];
          for (const d of fs.readdirSync('scripture', {withFileTypes:true}).filter(d=>d.isDirectory())) {
            const id=d.name, dir=path.join('scripture',id);
            for (const name of fs.readdirSync(dir).filter(n=>new RegExp(`^${id}-\\d{3}\\.json$`).test(n))) {
              const doc=JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));
              chapters++;
              for (const v of doc.verses||[]) {
                verses++;
                const ref=`${id} ${doc.chapter}:${v.verse}`;
                if(!v.modern?.text) missingModern.push(ref);
                if(!v.original?.text) missingOriginal.push(ref);
              }
            }
          }
          console.log({chapters,verses,missingModernCount:missingModern.length,missingOriginalCount:missingOriginal.length});
          if(missingModern.length) console.log('Missing modern:', missingModern.join(', '));
          if(missingOriginal.length) console.log('Missing original:', missingOriginal.join(', '));
          if(missingModern.length || missingOriginal.length) throw new Error('Reference-layer alignment gaps remain');
          NODE

      - name: Commit reference layers
        run: |
          if git diff --quiet; then
            echo "Reference layers already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripture metadata/reference-layer-report.json
          git commit -m "Backfill BSB and original-language reference layers"
          git pull --rebase origin main
          git push
