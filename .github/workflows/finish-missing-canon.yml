name: Finish remaining Oneness Scripture canon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-missing-canon.yml"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: oneness-missing-canon-production
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SCRIPTURE_MODEL: gpt-5.6-terra

jobs:
  history:
    name: Ezra through Esther (33 chapters)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "ezra,nehemiah,esther" 33 "Ezra-Nehemiah-Esther"

  psalms:
    name: Psalms (150 chapters)
    needs: history
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "psalms" 150 "Psalms"

  wisdom:
    name: Proverbs through Song of Songs (51 chapters)
    needs: psalms
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "proverbs,ecclesiastes,song-of-songs" 51 "Wisdom books"

  isaiah:
    name: Isaiah (66 chapters)
    needs: wisdom
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "isaiah" 66 "Isaiah"

  jeremiah:
    name: Jeremiah and Lamentations (57 chapters)
    needs: isaiah
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "jeremiah,lamentations" 57 "Jeremiah-Lamentations"

  ezekiel_daniel:
    name: Ezekiel and Daniel (60 chapters)
    needs: jeremiah
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "ezekiel,daniel" 60 "Ezekiel-Daniel"

  minor_prophets:
    name: Twelve / Minor Prophets (67 chapters)
    needs: ezekiel_daniel
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - run: npm install -g @github/copilot
      - run: bash scripts/run-canon-generation-batch.sh "hosea,joel,amos,obadiah,jonah,micah,nahum,habakkuk,zephaniah,haggai,zechariah,malachi" 67 "Minor Prophets"

  final_validation:
    name: Final generated-canon validation
    needs: minor_prophets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - name: Validate all newly generated books
        run: node scripts/validate-generated-canon.mjs --books="2-chronicles,ezra,nehemiah,esther,psalms,proverbs,ecclesiastes,song-of-songs,isaiah,jeremiah,lamentations,ezekiel,daniel,hosea,joel,amos,obadiah,jonah,micah,nahum,habakkuk,zephaniah,haggai,zechariah,malachi"
      - name: Rebuild final library index
        run: |
          node scripts/build-library-index.mjs
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/library-index.json
          git commit -m "Finalize complete Oneness Scripture library index"
          git push
